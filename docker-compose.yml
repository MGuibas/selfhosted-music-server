services:
  web:
    build: .
    container_name: spotifyprivado-web
    ports:
      - "8501:8501"
    volumes:
      - ./music:/music
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Copia .env.example a .env y define APP_PASSWORD}
      NAVIDROME_URL: http://navidrome:4533
      NAVIDROME_USER: ${NAVIDROME_USER:-}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
    restart: unless-stopped
    depends_on:
      - navidrome

  navidrome:
    image: deluan/navidrome:latest
    container_name: spotifyprivado-navidrome
    ports:
      - "4533:4533"
    volumes:
      - ./music:/music:ro
      - navidrome-data:/data
    environment:
      ND_SCANSCHEDULE: 5m
      ND_LOGLEVEL: info
    restart: unless-stopped

volumes:
  navidrome-data:
